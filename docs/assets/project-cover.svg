  <text x="96" y="178" fill="#f0f3f5" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700">Agentic Security Lab</text>
  <text x="98" y="226" fill="#aab7c2" font-family="Arial, Helvetica, sans-serif" font-size="25">Did the agent stay inside the authority it was given?</text>
  <g transform="translate(98 307)">
