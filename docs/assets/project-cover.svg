    <text x="22" y="35" fill="#8fa1b3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">PROPOSED ACTION</text>
    <text x="22" y="71" fill="#f0f3f5" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">repository.write</text>
    <text x="22" y="97" fill="#aab7c2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">update /profile/README.md</text>
  </g>
  <path d="M360 365H459" stroke="#8fa1b3" stroke-width="3"/>
  <path d="M447 353L459 365L447 377" fill="none" stroke="#8fa1b3" stroke-width="3"/>
  <g transform="translate(460 275)">
    <rect width="276" height="180" rx="8" fill="#182029" stroke="#5f7689" stroke-width="2"/>
    <text x="24" y="38" fill="#9fb4c5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">POLICY BOUNDARY</text>
    <path d="M24 60H252" stroke="#374754"/>
    <text x="24" y="91" fill="#f0f3f5" font-family="Arial, Helvetica, sans-serif" font-size="18">Capability</text>
    <text x="24" y="120" fill="#f0f3f5" font-family="Arial, Helvetica, sans-serif" font-size="18">Resource scope</text>
    <text x="24" y="149" fill="#f0f3f5" font-family="Arial, Helvetica, sans-serif" font-size="18">Approval + provenance</text>
  </g>
  <path d="M736 365H836" stroke="#8fa1b3" stroke-width="3"/>
  <path d="M824 353L836 365L824 377" fill="none" stroke="#8fa1b3" stroke-width="3"/>
