<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Security Lab</title>
  <desc id="desc">A policy boundary diagram between proposed agent actions and tool execution.</desc>
  <rect width="1200" height="630" fill="#0b0d0f"/>
  <path d="M0 78H1200M0 552H1200" stroke="#273039" stroke-width="2"/>
  <path d="M96 78V552M1104 78V552" stroke="#273039" stroke-width="2"/>
