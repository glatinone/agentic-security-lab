    <circle cx="37" cy="40" r="12" fill="#bc6848"/>
    <text x="62" y="47" fill="#efb29b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700">DENY / ASL-109</text>
    <text x="24" y="80" fill="#f0f3f5" font-family="Arial, Helvetica, sans-serif" font-size="17">Untrusted content influenced</text>
    <text x="24" y="102" fill="#f0f3f5" font-family="Arial, Helvetica, sans-serif" font-size="17">a protected write.</text>
